name: Mobile Code and Security Review

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]
  schedule:
    - cron: '20 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-code-gates:
    name: Security gates (${{ matrix.ref || 'change' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["develop","qa"]' || '[""]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements-security.txt
      - name: Install locked mobile dependencies
        run: npm ci
      - name: Install secret scanner
        run: python -m pip install -r ci/requirements-security.txt
      - name: Verify fail-closed and reviewed-fixture policies
        run: npm run security:policy
      - name: Run independent checks and preserve safe reports
        run: python ci/security_review.py --out reports/security/github
      - name: Publish review summary
        if: always()
        run: |
          if test -f reports/security/github/summary.md; then
            cat reports/security/github/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-security-${{ matrix.ref || 'change' }}
          path: reports/security/github/
          if-no-files-found: error
          retention-days: 14
