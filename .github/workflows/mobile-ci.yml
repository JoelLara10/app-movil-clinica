name: OftalCore Mobile CI

on:
  pull_request:
    branches: [main, qa, develop]
  push:
    branches: [main, qa, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Preserve the existing React Navigation architecture on Expo SDK 57.
      EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx expo-doctor
      - name: Export production bundle
        env:
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://api-clinica-jx4m.onrender.com/api/v1
        run: npx expo export --platform web
      - name: Export QA bundle
        env:
          APP_ENV: qa
          EXPO_PUBLIC_API_URL: https://ineo-pbl-entrega.onrender.com/api/v1
        run: npx expo export --platform web --output-dir dist-qa
      - name: Export native Android QA bundle
        env:
          APP_ENV: qa
          EXPO_PUBLIC_API_URL: https://ineo-pbl-entrega.onrender.com/api/v1
        run: npx expo export --platform android --output-dir dist-android-qa

