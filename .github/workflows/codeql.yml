name: Mobile CodeQL security analysis

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]
  schedule:
    - cron: '50 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["develop","qa"]' || '[""]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref || github.ref }}
          persist-credentials: false
      - name: Identify analyzed revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          ref: ${{ matrix.ref && format('refs/heads/{0}', matrix.ref) || github.ref }}
          sha: ${{ steps.revision.outputs.sha }}
